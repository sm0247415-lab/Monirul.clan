<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEARLESS</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Oswald',sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */

.hero{
height:100vh;
width:100%;
background:
linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.75)),
url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1200&auto=format&fit=crop');
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
align-items:center;
}

/* LOGO */

.logo{
margin-top:40px;
font-size:70px;
font-weight:700;
color:red;
letter-spacing:8px;
text-shadow:
0 0 10px red,
0 0 20px red,
0 0 40px red;
}

/* NAVBAR */

nav{
margin-top:40px;
display:flex;
gap:30px;
flex-wrap:wrap;
justify-content:center;
}

nav a{
color:white;
text-decoration:none;
font-size:28px;
font-weight:300;
transition:0.3s;
}

nav a:hover{
color:red;
text-shadow:0 0 10px red;
}

/* BUTTON */

.join-btn{
margin-top:40px;
padding:18px 70px;
border:2px solid red;
background:rgba(0,0,0,0.4);
color:white;
font-size:30px;
letter-spacing:3px;
cursor:pointer;
transition:0.4s;
backdrop-filter:blur(5px);
}

.join-btn:hover{
background:red;
box-shadow:0 0 20px red;
}

/* CONTENT */

.content{
margin-top:120px;
text-align:center;
padding:20px;
}

.content h1{
font-size:120px;
line-height:100px;
font-weight:700;
}

.white{
color:white;
}

.red{
color:red;
text-shadow:
0 0 10px red,
0 0 20px red;
}

.content p{
margin-top:30px;
font-size:28px;
color:#ddd;
max-width:900px;
line-height:45px;
}

/* MAIN BUTTON */

.enter-btn{
margin-top:50px;
padding:25px 90px;
font-size:35px;
font-weight:bold;
background:red;
border:none;
color:white;
cursor:pointer;
transition:0.4s;
box-shadow:0 0 30px red;
}

.enter-btn:hover{
transform:scale(1.05);
box-shadow:0 0 50px red;
}

/* MOBILE */

@media(max-width:768px){

.logo{
font-size:55px;
}

nav{
gap:18px;
}

nav a{
font-size:20px;
}

.join-btn{
font-size:22px;
padding:14px 40px;
}

.content{
margin-top:80px;
}

.content h1{
font-size:80px;
line-height:70px;
}

.content p{
font-size:20px;
line-height:35px;
}

.enter-btn{
font-size:24px;
padding:18px 50px;
}

}

</style>
</head>

<body>

<div class="hero">

<div class="logo">FEARLESS</div>

<nav>
<a href="#">HOME</a>
<a href="#">ABOUT</a>
<a href="#">CREW</a>
<a href="#">GALLERY</a>
<a href="#">CONTACT</a>
</nav>

<button class="join-btn">JOIN CREW</button>

<div class="content">

<h1>
<span class="white">NO</span>
<span class="red">FEAR</span>
</h1>

<p>
Power, money, loyalty and revenge — all in one empire.
We don’t follow rules, we make them.
</p>

<button class="enter-btn">ENTER THE WORLD</button>

</div>

</div>

<!-- AUTO MUSIC -->

<audio autoplay loop>
<source src="song.mp3" type="audio/mp3">
</audio>

</body>
</html>
