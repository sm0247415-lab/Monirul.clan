<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clan Chat Pro</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

<style>
body { margin:0; font-family:Arial; display:flex; }

#sidebar {
  width:30%; background:#075e54; color:white; padding:10px;
}

#chatArea {
  width:70%; display:flex; flex-direction:column; background:#ece5dd;
}

.clan { padding:10px; cursor:pointer; }

#chatBox { flex:1; overflow-y:auto; padding:10px; }

.msg {
  max-width:60%;
  padding:10px;
  margin:5px;
  border-radius:10px;
}

.me { background:#dcf8c6; margin-left:auto; }
.other { background:white; }

.inputBox { display:flex; padding:10px; background:#fff; }

input { flex:1; padding:10px; }
button { padding:10px; margin-left:5px; }

#online { font-size:12px; color:lime; }
</style>
</head>

<body>

<div id="sidebar">
<h3>Clans</h3>
<div id="clanList"></div>

<input id="newClan" placeholder="Clan name">
<button onclick="createClan()">Create</button>

<h4>🟢 Online</h4>
<div id="online"></div>
</div>

<div id="chatArea">
<div id="chatBox"></div>

<div class="inputBox">
  <input id="message" placeholder="Message">
  <input type="file" id="img">
  <button onclick="sendMsg()">Send</button>
</div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDHchAe__ToUrxYMTQ0Agx4kDSmUE36bV4",
  authDomain: "rate-me-3efb9b.firebaseapp.com",
  projectId: "rate-me-3efb9b",
  storageBucket: "rate-me-3efb9b.appspot.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

// Username
let username = localStorage.getItem("name");
if(!username){
  username = prompt("Enter name:");
  localStorage.setItem("name", username);
}

// Online user
db.collection("online").doc(username).set({active:true});

// Show online
db.collection("online").onSnapshot(snap=>{
  let list="";
  snap.forEach(doc=> list += doc.id+"<br>");
  document.getElementById("online").innerHTML = list;
});

let currentClan = "";
let isAdmin = false;

// Create clan (admin set)
function createClan(){
  let name = document.getElementById("newClan").value;
  if(name=="") return;

  db.collection("clans").doc(name).set({
    admin: username
  });
}

// Show clans
db.collection("clans").onSnapshot(snap=>{
  let html="";
  snap.forEach(doc=>{
    let clan = doc.id;
    html += `<div class="clan" onclick="joinClan('${clan}','${doc.data().admin}')">${clan}</div>`;
  });
  document.getElementById("clanList").innerHTML = html;
});

// Join clan
function joinClan(clan, admin){
  currentClan = clan;
  isAdmin = (admin === username);
}

// Send message + image
async function sendMsg(){
  let msg = document.getElementById("message").value;
  let file = document.getElementById("img").files[0];

  if(currentClan=="") return;

  let imgUrl = "";

  if(file){
    let ref = storage.ref("images/"+Date.now());
    await ref.put(file);
    imgUrl = await ref.getDownloadURL();
  }

  db.collection("messages").add({
    clan: currentClan,
    name: username,
    message: msg,
    image: imgUrl,
    time: Date.now()
  });

  document.getElementById("message").value="";
  document.getElementById("img").value="";
}
