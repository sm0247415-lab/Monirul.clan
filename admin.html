<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel 🔐</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: black;
  color: white;
}

h1 {
  text-align: center;
  color: #ff7eb3;
  margin-top: 15px;
}

/* Card */
.box {
  background: rgba(255,255,255,0.1);
  margin: 10px;
  padding: 12px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(255,126,179,0.3);
}

/* Top bar */
.top {
  display: flex;
  justify-content: space-between;
  padding: 10px;
}

button {
  padding: 6px 10px;
  border-radius: 8px;
  border: none;
  background: #ff4e9b;
  color: white;
  cursor: pointer;
}

.count {
  text-align: center;
  margin: 10px;
  color: #aaa;
}
</style>
</head>

<body>

<div class="top">
  <button onclick="location.reload()">🔄 Refresh</button>
  <button onclick="logout()">🚪 Exit</button>
</div>

<h1>🔥 Admin Panel</h1>

<div class="count" id="count">Loading...</div>

<div id="data"></div>

<script>
// 🔥 SAME Firebase config paste kar
const firebaseConfig = {
  apiKey: "AIzaSyDHchAe__ToUrxYMTQ0Agx4kDSmUE36bV4",
  authDomain: "rate-me-3efb9.firebaseapp.com",
  projectId: "rate-me-3efb9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🔥 LOAD DATA REALTIME
db.collection("feedback").onSnapshot((snap) => {

  let html = "";
  let total = 0;

  snap.forEach(doc => {
    let d = doc.data();
    total++;

    html += `
    <div class="box">
      <b>${d.name || "Anonymous"}</b><br><br>
      👀 Eyes: ${d.eyes || "N/A"}<br>
      💇 Hair: ${d.hair || "N/A"}<br>
      🖐 Hands: ${d.hands || "N/A"}<br><br>
      💖 Best: ${d.best || "-"}<br>
      📝 Feedback: ${d.feedback || "-"}
    </div>
    `;
  });

  document.getElementById("data").innerHTML = html;
  document.getElementById("count").innerText = "Total Feedback: " + total;

});

// 🔐 EXIT BUTTON
function logout() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
